<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buy Perfume Gabrielle by Chanel EDP">
    <link rel="stylesheet" href="/perfume-card/styles/reset.css">
    <link rel="stylesheet" href="/perfume-card/styles/style.css">
    <link rel="shortcut icon" href="/perfume-card/assets/favicon-32x32.png" type="image/png">
    <title>Perfume card</title>
</head>

<body>
    <main class="container">
        <div class="image__box">
            <img src="/perfume-card/assets/image-product-desktop.jpg" alt="Gabrielle by Chanel Perfume"
                class="image__desktop" width="300" height="456">
            <img src="/perfume-card/assets/image-product-mobile.jpg" alt="Gabrielle by Chanel Perfume" class="image" width="350" height="342">
        </div>
        <section class="content__box">
            <h2 class="content__title">perfume</h2>
            <h1 class="perfume__title">Gabrielle Essence Eau de Parfum</h1>
            <p class="product__description">A floral, solar and voluptuous interpretation composed by <strong
                    class="perfumer">Olivier Polge</strong>, Perfumer-Creator for the House of <strong
                            class="brand">Chanel</strong>.</p>
            <div class="price__box">
                <h3 class="actual__price">$149.99</h3>
                <span class="old__price">$169.99</span>
            </div>
            <button class="cart__button">
                <img src="/perfume-card/assets/icon-cart.svg" alt="cart image" class="button__icon">
                <p class="button__text">Add to Cart</p>
            </button>
        </section>
    </main>
</body>

</html>
